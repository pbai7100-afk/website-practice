<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启点数字化 · 企业官网</title>
<style>body{margin:0;font:16px/1.7 system-ui;background:#f6f8fb;color:#18243a}header,section,footer{padding:24px max(5vw,20px)}header{background:#11213d;color:white}nav a{color:white;margin-right:20px}h1{font-size:clamp(32px,5vw,58px)}.hero{padding:65px max(5vw,20px);background:#173158;color:white}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 6px 22px #17253d12}.card img{width:100%;height:160px;object-fit:cover}button{background:#1469d2;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,textarea{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 14px;border:1px solid #bcc8d8;border-radius:8px}dialog{border:0;border-radius:16px;max-width:540px;width:90%;box-shadow:0 12px 50px #0004}footer{background:#11213d;color:white}</style>
<header><div class="wrap"><strong>启点数字化</strong><nav><a href="#about">公司简介</a><a href="#advantages">服务优势</a><a href="#products">产品与服务</a><a href="#cases">案例</a></nav></div></header>
<div class="hero"><div class="wrap"><h1>让企业数字化更简单</h1><p>从官网建设到管理系统，为企业提供可靠的数字化方案。</p><a href="#products"><button>查看产品与服务</button></a></div></div>
<section id="about"><div class="wrap"><h2>公司简介</h2><p>启点数字化是一家用于建站全流程练习的虚构企业。</p></div></section>
<section id="advantages"><div class="wrap"><h2>服务优势</h2><div class="grid"><div class="card">响应式设计</div><div class="card">清晰的交付流程</div><div class="card">易维护的内容后台</div></div></div></section>
<section id="products"><div class="wrap"><h2>产品与服务</h2><div id="list" class="grid"></div></div></section>
<section id="cases"><div class="wrap"><h2>案例</h2><div class="card">演示案例：中小企业品牌官网改版</div></div></section>
<footer>启点数字化 · 练习项目</footer>
<dialog id="detail"><button onclick="detail.close()">关闭</button><div id="content"></div><h3>咨询这项服务</h3><form id="inquiry"><label>姓名<input name="name" required></label><label>联系方式<input name="contact" required></label><label>需求描述<textarea name="message"></textarea></label><button>提交咨询</button></form><p id="notice"></p></dialog>
<script>let products=[],selected;const escape=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/products').then(r=>r.json()).then(xs=>{products=xs;list.innerHTML=xs.length?xs.map(p=>'<article class="card">'+(p.image?'<img src="'+escape(p.image)+'" alt="">':'')+'<h3>'+escape(p.name)+'</h3><p>'+escape(p.summary)+'</p><button data-id="'+p.id+'">查看详情</button></article>').join(''):'暂无已发布产品';});list.onclick=e=>{let p=products.find(x=>x.id===e.target.dataset.id);if(!p)return;selected=p;content.innerHTML='<h2>'+escape(p.name)+'</h2>'+(p.image?'<img width="100%" src="'+escape(p.image)+'" alt="">':'')+'<p>'+escape(p.summary)+'</p><p>价格：'+escape(p.price)+'</p><p>参数：'+escape(p.specs)+'</p><p>适用行业：'+escape(p.industry)+'</p>';notice.textContent='';detail.showModal();};inquiry.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(inquiry));x.productId=selected.id;let r=await fetch('/api/inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});notice.textContent=r.ok?'咨询已提交':'提交失败';if(r.ok)inquiry.reset();};</script></html>
