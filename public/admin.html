<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容管理后台</title>
<style>body{font:16px/1.6 system-ui;max-width:960px;margin:30px auto;padding:0 18px;background:#f5f7fb;color:#18243a}section,article{background:white;padding:22px;border-radius:12px;margin:15px 0}input,textarea{box-sizing:border-box;width:100%;padding:9px;margin:4px 0 10px;border:1px solid #bbc7d7;border-radius:6px}button{border:0;border-radius:6px;padding:9px 14px;background:#1469d2;color:white;cursor:pointer;margin:4px}button.danger{background:#ab2940}.muted{color:#667}a{color:#1469d2}</style>
<h1>网站管理后台</h1><p><a href="/">查看官网</a> · 初次登录练习密码：practice-only（仅本地使用）</p>
<section id="loginBox"><h2>管理员登录</h2><form id="login"><input type="password" name="password" placeholder="密码" required><button>登录</button></form></section>
<main id="dashboard" hidden><section><h2 id="heading">新增产品</h2><form id="editor"><input name="name" placeholder="产品名称" required><input name="image" placeholder="图片网址（可选）"><label>或选择本地 JPG 图片<input id="imageFile" type="file" accept=".jpg,.jpeg,image/jpeg"></label><textarea name="summary" placeholder="简介"></textarea><input name="price" placeholder="价格，如按需报价"><input name="specs" placeholder="参数"><input name="industry" placeholder="适用行业"><button>保存草稿</button><button type="button" id="cancel" hidden>取消编辑</button></form></section><section><h2>产品管理</h2><div id="products"></div></section><section><h2>客户咨询</h2><div id="inquiries"></div></section></main><p id="notice"></p>
<script>let items=[],editing=null;const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||'请求失败');return x;}async function refresh(){items=await api('/api/products');products.innerHTML=items.map(p=>'<article><strong>'+esc(p.name)+'</strong> <span class="muted">'+(p.status==='draft'?'草稿':'已发布')+'</span><p>'+esc(p.summary)+'</p><button data-action="edit" data-id="'+p.id+'">编辑</button><button data-action="toggle" data-id="'+p.id+'">'+(p.status==='draft'?'发布':'撤回草稿')+'</button><button class="danger" data-action="delete" data-id="'+p.id+'">删除</button></article>').join('')||'暂无产品';let qs=await api('/api/admin/inquiries');inquiries.innerHTML=qs.map(q=>'<article><strong>'+esc(q.name)+'</strong> · '+esc(q.contact)+'<p>'+esc(items.find(p=>p.id===q.productId)?.name||'产品已删除')+'：'+esc(q.message)+'</p></article>').join('')||'暂无咨询';}login.onsubmit=async e=>{e.preventDefault();try{await api('/api/login','POST',Object.fromEntries(new FormData(login)));loginBox.hidden=true;dashboard.hidden=false;await refresh();}catch(err){notice.textContent=err.message;}};editor.onsubmit=async e=>{e.preventDefault();try{let x=Object.fromEntries(new FormData(editor));if(editing){x.status=items.find(p=>p.id===editing).status;await api('/api/admin/products/'+editing,'PUT',x);}else await api('/api/admin/products','POST',x);editing=null;editor.reset();heading.textContent='新增产品';cancel.hidden=true;await refresh();notice.textContent='草稿已保存';}catch(err){notice.textContent=err.message;}};cancel.onclick=()=>{editing=null;editor.reset();heading.textContent='新增产品';cancel.hidden=true;};products.onclick=async e=>{let id=e.target.dataset.id,action=e.target.dataset.action,p=items.find(x=>x.id===id);if(!p)return;if(action==='edit'){editing=id;for(let key of ['name','image','summary','price','specs','industry'])editor.elements[key].value=p[key]||'';heading.textContent='编辑产品';cancel.hidden=false;window.scrollTo(0,0);return;}if(action==='delete'&&!confirm('确定删除此产品？'))return;try{if(action==='delete')await api('/api/admin/products/'+id,'DELETE');if(action==='toggle')await api('/api/admin/products/'+id,'PUT',{...p,status:p.status==='draft'?'published':'draft'});await refresh();notice.textContent='操作成功';}catch(err){notice.textContent=err.message;}};refresh().then(()=>{loginBox.hidden=true;dashboard.hidden=false;}).catch(()=>{});</script><script>const originalSave=editor.onsubmit;editor.onsubmit=async e=>{e.preventDefault();const file=document.getElementById("imageFile").files[0];if(file){try{if(file.size>5*1024*1024)throw Error("图片不能超过 5 MB");const r=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:file});const x=await r.json();if(!r.ok)throw Error(x.error);editor.elements.image.value=x.url;}catch(err){notice.textContent=err.message;return;}}await originalSave(e);document.getElementById("imageFile").value="";};</script></html>
